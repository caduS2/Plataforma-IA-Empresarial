name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nucleo_ai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d nucleo_ai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/nucleo_ai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - name: Generate ephemeral JWT secret
        run: echo "JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
      - run: alembic upgrade head
        working-directory: backend
      - run: ruff check .
        working-directory: backend
      - run: ruff format --check .
        working-directory: backend
      - run: pytest --cov=app --cov-report=term-missing
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm, cache-dependency-path: frontend-web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend-web
      - run: pnpm lint
        working-directory: frontend-web
      - run: pnpm typecheck
        working-directory: frontend-web
      - run: pnpm test
        working-directory: frontend-web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend-web
      - run: pnpm test:e2e
        working-directory: frontend-web
      - run: pnpm build
        working-directory: frontend-web
        env: { BACKEND_URL: "http://127.0.0.1:8000" }
